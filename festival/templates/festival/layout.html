<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Festival</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: #222;
            padding: 15px;
        }

        nav a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            padding: 20px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        button {
            padding: 8px 12px;
            margin-top: 10px;
            cursor: pointer;
        }

        form {
            margin-top: 10px;
        }
    </style>
</head>
<body>

<header>
    <nav>
        <a href="{% url 'lista_dias' %}">Dias</a>
        <a href="{% url 'lista_palcos' %}">Palcos</a>
        <a href="{% url 'criar_concerto' %}">Criar Concerto</a>
    </nav>
</header>

<main>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</main>

</body>
</html>
