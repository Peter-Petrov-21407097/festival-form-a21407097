{% extends "festival/layout.html" %}

{% block content %}
<h1>Editar Concerto</h1>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Guardar alterações</button>
</form>

<a href="{% url 'concerto_detail' concerto.id %}">
    <button>Cancelar</button>
</a>

{% endblock %}
