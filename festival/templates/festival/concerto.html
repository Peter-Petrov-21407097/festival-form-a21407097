{% extends "festival/layout.html" %}

{% block content %}
<h1>Detalhes do Concerto</h1>

<p><strong>Banda:</strong> {{ concerto.banda.nome }}</p>
<p><strong>Dia:</strong> {{ concerto.dia.data }}</p>
<p><strong>Hora:</strong> {{ concerto.hora }}</p>
<p><strong>Palco:</strong> {{ concerto.palco.nome }}</p>

<a href="{% url 'editar_concerto' concerto.id %}">
    <button>Editar este concerto</button>
</a>

<form action="{% url 'apagar_concerto' concerto.id %}" method="POST" style="display:inline;">
    {% csrf_token %}
    <button type="submit" onclick="return confirm('Tem a certeza que quer apagar este concerto?');">
        Apagar concerto
    </button>
</form>

{% endblock %}
